[project]
name = "job-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "langchain>=1.3.16",
    "langchain-anthropic>=1.6.1",
    "langchain-core>=1.6.0",
    "langgraph>=1.2.11",
    "lxml>=6.1.1",
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "python-docx>=1.2.0",
    "requests>=2.34.2",
    "uvicorn>=0.52.4",
    "voyageai>=0.5.0",
]

[project.scripts]
job-scraper = "job_scraper:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
